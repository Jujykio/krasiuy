<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网名生成器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff;
    font-family: 'Inter', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    width: 520px; height: 520px;
    background: radial-gradient(circle, #d4e0ff 0%, #e8d9ff 60%, transparent 80%);
    top: -160px; right: -120px;
    animation: float1 14s ease-in-out infinite;
  }

  body::after {
    width: 480px; height: 480px;
    background: radial-gradient(circle, #ffe0f0 0%, #d9f0ff 60%, transparent 80%);
    bottom: -140px; left: -100px;
    animation: float2 16s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-40px, 50px) scale(1.08); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(50px, -40px) scale(1.1); }
  }

  .glass-panel {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    padding: 40px 36px 36px;
    border-radius: 36px;
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow:
      0 8px 32px rgba(120, 140, 200, 0.12),
      0 2px 8px rgba(120, 140, 200, 0.06),
      inset 0 1px 1px rgba(255, 255, 255, 0.95),
      inset 0 -1px 1px rgba(255, 255, 255, 0.4);
    outline: 1px solid rgba(255, 255, 255, 0.6);
    outline-offset: -4px;
    animation: panelIn 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes panelIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); filter: blur(8px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  .glass-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,1) 30%, rgba(255,255,255,1) 70%, transparent);
    border-radius: 50%;
    opacity: 0.9;
  }

  h1 {
    font-size: 21px;
    font-weight: 600;
    text-align: center;
    color: #1a1f36;
    letter-spacing: 1.5px;
    margin-bottom: 28px;
  }

  .input-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }

  input[type="text"] {
    flex: 1;
    padding: 15px 18px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.9);
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #1a1f36;
    font-size: 15px;
    letter-spacing: 2px;
    outline: none;
    transition: all 0.3s ease;
    box-shadow: inset 0 1px 3px rgba(120, 140, 200, 0.06), 0 2px 8px rgba(120, 140, 200, 0.04);
    font-family: inherit;
    width: 100%;
  }

  input[type="text"]::placeholder {
    color: rgba(40, 50, 80, 0.28);
    letter-spacing: 1px;
  }

  input[type="text"]:focus {
    border-color: rgba(160, 180, 255, 0.9);
    background: rgba(255, 255, 255, 0.75);
    box-shadow: 0 0 0 4px rgba(160, 180, 255, 0.15), inset 0 1px 3px rgba(120, 140, 200, 0.05);
  }

  .mini-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 16px;
  }

  .mini-field {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .mini-field label {
    font-size: 12.5px;
    color: rgba(40, 50, 80, 0.45);
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .mini-field input {
    padding: 9px 10px;
    border-radius: 11px;
    border: 1px solid rgba(255, 255, 255, 0.9);
    background: rgba(255, 255, 255, 0.6);
    color: #2a3a6a;
    font-size: 13.5px;
    text-align: center;
    outline: none;
    transition: all 0.25s ease;
    font-family: inherit;
    box-shadow: inset 0 1px 2px rgba(120, 140, 200, 0.05);
    width: 56px;
  }

  .mini-field input.wide {
    width: 96px;
    text-align: left;
    letter-spacing: 1.5px;
  }

  .mini-field input:focus {
    border-color: rgba(160, 180, 255, 0.9);
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 0 0 3px rgba(160, 180, 255, 0.12);
  }

  button.gen-btn {
    padding: 15px 26px;
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(230,238,255,0.85));
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #2a3a6a;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(120, 140, 200, 0.12), inset 0 1px 1px rgba(255,255,255,1);
    font-family: inherit;
    width: 100%;
  }

  button.gen-btn:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, rgba(255,255,255,1), rgba(220,232,255,0.95));
    box-shadow: 0 8px 28px rgba(120, 140, 200, 0.2), inset 0 1px 1px rgba(255,255,255,1);
    color: #1a2a5a;
  }

  button.gen-btn:active {
    transform: scale(0.98) translateY(0);
    box-shadow: 0 2px 8px rgba(120, 140, 200, 0.15), inset 0 1px 3px rgba(120, 140, 200, 0.1);
  }

  .results {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    min-height: 70px;
    align-content: flex-start;
    margin-top: 18px;
  }

  .tag {
    padding: 11px 20px;
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #2a3a6a;
    font-size: 16px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    user-select: none;
    box-shadow: 0 2px 8px rgba(120, 140, 200, 0.06), inset 0 1px 1px rgba(255,255,255,0.95);
    font-weight: 500;
    animation: tagIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) backwards;
  }

  @keyframes tagIn {
    from { opacity: 0; transform: scale(0.85) translateY(8px); filter: blur(4px); }
    to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  }

  .tag:hover {
    background: rgba(255, 255, 255, 0.85);
    border-color: rgba(160, 180, 255, 0.8);
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 10px 28px rgba(120, 140, 200, 0.18), inset 0 1px 1px rgba(255,255,255,1);
    color: #1a2a6a;
  }

  .tag:active { transform: scale(0.96) translateY(0); }

  .empty {
    width: 100%;
    text-align: center;
    padding: 26px 0;
    color: rgba(40, 50, 80, 0.22);
    font-size: 13.5px;
    letter-spacing: 1px;
  }

  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(24px) scale(0.9);
    padding: 12px 28px;
    border-radius: 40px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 8px 32px rgba(120, 140, 200, 0.15), inset 0 1px 1px rgba(255,255,255,1);
    color: #2a3a6a;
    font-size: 14px;
    letter-spacing: 1px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
    z-index: 100;
    max-width: 80vw;
    text-align: center;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  @media (max-width: 480px) {
    .glass-panel { padding: 28px 20px 24px; border-radius: 28px; }
    .tag { padding: 10px 16px; font-size: 15px; }
    .mini-field input.wide { width: 80px; }
  }
</style>
</head>
<body>

<div class="glass-panel">
  <h1>✦ 网名生成器 ✦</h1>

  <div class="input-row">
    <input type="text" id="letterInput" placeholder="输入字母…" maxlength="24" autocomplete="off" spellcheck="false">
  </div>

  <div class="mini-row">
    <div class="mini-field">
      <label>长度</label>
      <input type="number" id="lenMin" value="5" min="2" max="24">
      <span style="color:rgba(40,50,80,0.25)">~</span>
      <input type="number" id="lenMax" value="8" min="2" max="24">
    </div>

    <div class="mini-field">
      <label>数量</label>
      <input type="number" id="count" value="12" min="1" max="60">
    </div>
  </div>

  <div class="mini-row">
    <div class="mini-field">
      <label>符号</label>
      <input type="text" id="symbolInput" class="wide" placeholder="如 . _ -" maxlength="12" autocomplete="off" spellcheck="false">
    </div>

    <div class="mini-field">
      <label>数字</label>
      <input type="text" id="numberInput" class="wide" placeholder="如 1 2 3" maxlength="12" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <button class="gen-btn" onclick="generateNames()">生 成 网 名</button>

  <div class="results" id="nameResults">
    <div class="empty">输入字母后点击「生成网名」</div>
  </div>
</div>

<div class="toast" id="toast">已复制</div>

<script>
  const letterInput = document.getElementById('letterInput');
  const nameResults = document.getElementById('nameResults');
  const symbolInput = document.getElementById('symbolInput');
  const numberInput = document.getElementById('numberInput');
  const toast       = document.getElementById('toast');

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function randItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast('已复制：' + text));
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已复制：' + text);
    }
  }

  function generateNames() {
    const raw = letterInput.value.replace(/[^a-zA-Z]/g, '').toLowerCase();

    if (raw.length < 2) {
      nameResults.innerHTML = '<div class="empty">请输入至少 2 个字母</div>';
      return;
    }

    const symbols = symbolInput.value.replace(/\s/g, '').split('').filter(Boolean);
    const numbers = numberInput.value.replace(/\s/g, '').split('').filter(Boolean);

    let lenMin = parseInt(document.getElementById('lenMin').value) || 3;
    let lenMax = parseInt(document.getElementById('lenMax').value) || raw.length;
    const count = Math.min(60, Math.max(1, parseInt(document.getElementById('count').value) || 12));

    lenMin = Math.max(2, Math.min(lenMin, raw.length));
    lenMax = Math.max(lenMin, Math.min(lenMax, raw.length));

    const set = new Set();
    let guard = 0;
    const maxGuard = count * 300;

    while (set.size < count && guard < maxGuard) {
      guard++;
      const len = Math.floor(Math.random() * (lenMax - lenMin + 1)) + lenMin;
      let core = shuffle(raw.split('')).slice(0, len).join('');

      if (core === raw && raw.length === len) continue;

      if (numbers.length && Math.random() < 0.75) {
        const num = randItem(numbers);
        const pos = Math.floor(Math.random() * 3);
        if (pos === 0) core = num + core;
        else if (pos === 1) core = core + num;
        else {
          const idx = Math.floor(Math.random() * (core.length + 1));
          core = core.slice(0, idx) + num + core.slice(idx);
        }
      }

      if (symbols.length && Math.random() < 0.85) {
        const sym = randItem(symbols);
        const pos = Math.floor(Math.random() * 3);
        if (pos === 0) core = sym + core;
        else if (pos === 1) core = core + sym;
        else {
          const idx = Math.floor(Math.random() * (core.length + 1));
          core = core.slice(0, idx) + sym + core.slice(idx);
        }
      }

      set.add(core);
    }

    nameResults.innerHTML = '';
    if (!set.size) {
      nameResults.innerHTML = '<div class="empty">生成失败，请调整参数</div>';
      return;
    }

    [...set].forEach((word, i) => {
      const div = document.createElement('div');
      div.className = 'tag';
      div.textContent = word;
      div.style.animationDelay = (i * 0.035) + 's';
      div.onclick = () => copy(word);
      nameResults.appendChild(div);
    });
  }

  letterInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') generateNames();
  });
</script>

</body>
</html>
